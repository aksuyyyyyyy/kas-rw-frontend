<script>
  const API = "http://98.94.95.227:8000";

  function formatRupiah(n) {
    return "Rp " + Number(n).toLocaleString("id-ID");
  }

  async function loadTransaksi() {
    try {
      const res = await fetch(API + "/transaksi");

      const data = await res.json();

      const tbody =
        document.getElementById("tabel-transaksi");

      tbody.innerHTML = "";

      data.forEach(function (t) {
        tbody.innerHTML += `
          <tr>
            <td>${t.tanggal}</td>
            <td>${t.keterangan}</td>
            <td class="${t.jenis}">${t.jenis}</td>
            <td>${formatRupiah(t.jumlah)}</td>
          </tr>
        `;
      });

    } catch (err) {
      console.error("Gagal load transaksi:", err);
      alert("Backend tidak bisa diakses");
    }
  }

  document
    .getElementById("form-transaksi")
    .addEventListener("submit", async function (e) {

      e.preventDefault();

      const body = {
        tanggal:
          document.getElementById("tanggal").value,

        keterangan:
          document.getElementById("keterangan").value,

        jenis:
          document.getElementById("jenis").value,

        jumlah:
          parseFloat(
            document.getElementById("jumlah").value
          )
      };

      try {

        const res = await fetch(API + "/transaksi", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify(body)
        });

        if (!res.ok) {
          throw new Error("Gagal simpan");
        }

        e.target.reset();

        loadTransaksi();

      } catch (err) {
        console.error(err);
        alert("Gagal menyimpan data");
      }
    });

  loadTransaksi();
</script>
